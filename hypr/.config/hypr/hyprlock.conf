# Lock screen. Colours and wallpaper come from matugen.
source = ~/.config/hypr/hyprlock-colors.conf

$font = DejaVu Sans Mono

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

# Clock
label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 110
    font_family = $font
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $on_surface_variant
    font_size = 22
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    rounding = 12
    outer_color = $primary
    inner_color = $surface
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error
    font_family = $font
    placeholder_text = <i>Password…</i>
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}
