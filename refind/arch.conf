# Boot menu settings and one Arch entry for both kernels; Tab/F2 on it opens the submenu with the LTS kernel.
# The UKIs embed their own kernel options, so no "options" lines are needed.
# Installed to /boot/EFI/refind/arch.conf by install.sh

# Boot Windows unless something else is picked within 8 seconds (overrides "timeout 20" earlier in refind.conf).
# "bootmgfw" matches the Windows Boot Manager loader, bootmgfw.efi.
timeout 8
default_selection bootmgfw

# Tools row: shutdown, reboot, firmware. rEFInd 0.14 quirk: showtools only overwrites the first N of its 12
# default slots, so leftover defaults (about, shutdown, reboot, firmware) reappear after ours. The other 9 names
# fill the remaining slots with tools this machine doesn't have (repeats are fine), so they show nothing.
# Don't use hidden_tags as a filler: it always shows.
showtools shutdown reboot firmware shell memtest gdisk gptsync apple_recovery mok_tool shell netboot csr_rotate

# Hide the auto-detected copies of these (and the raw kernels, which have no initramfs with UKI-only presets).
# The leading "+" keeps rEFInd's default skip list.
dont_scan_files +,vmlinuz-linux,vmlinuz-linux-lts,arch-linux.efi,arch-linux-lts.efi

menuentry "Arch Linux" {
    icon   /EFI/refind/themes/nox-matugen/icons/os_arch.png
    loader /EFI/Linux/arch-linux.efi
    submenuentry "Arch Linux (LTS kernel)" {
        loader /EFI/Linux/arch-linux-lts.efi
    }
}
