# Based on rEFInd-nox (https://github.com/pixix4/rEFInd-nox) with the wallpaper as background.
# Installed to /boot/EFI/refind/themes/nox-matugen by ~/.dotfiles/refind/install.sh

hideui singleuser,hints,arrows,label,badges
icons_dir themes/nox-matugen/icons
banner themes/nox-matugen/background.png
banner_scale fillscreen
selection_big   themes/nox-matugen/selection_big.png
selection_small themes/nox-matugen/selection_small.png
