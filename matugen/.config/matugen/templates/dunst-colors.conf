# Generated by matugen from the current wallpaper
# Same palette as waybar: surface background, primary text, primary border at 40% alpha
[global]
    frame_color = "{{colors.primary.default.hex}}66"
    highlight = "{{colors.primary.default.hex}}"

[urgency_low]
    background = "{{colors.surface.default.hex}}"
    foreground = "{{colors.primary.default.hex}}b3"

[urgency_normal]
    background = "{{colors.surface.default.hex}}"
    foreground = "{{colors.primary.default.hex}}"

[urgency_critical]
    background = "{{colors.surface.default.hex}}"
    foreground = "{{colors.error.default.hex}}"
    frame_color = "{{colors.error.default.hex}}"
    highlight = "{{colors.error.default.hex}}"
